<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A1F6B">
<title>Azulejaria</title>
<style>
@font-face{font-family:"Young Serif";src:url(fonts/young-serif-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
/* Identidade: um painel de azulejos de Lisboa. Fundo em azul-cobalto com padrão de azulejo,
   placa de rua esmaltada como logotipo, moldura creme (cercadura) em volta do painel,
   e cada cor de azulejo com o seu próprio desenho (ajuda também quem tem daltonismo). */
:root{
  color-scheme:dark;
  --bg:#1546C9; --bg-deep:#0A1F6B; --board:#0B1B5C;
  --glaze:#FBF8F1; --glaze-2:#ECE6D8; --cobalt:#1C3FAA; --cobalt-ink:#142E80;
  --gold:#FFC93C; --gold-deep:#E8930C;
  --ink:#FFFFFF; --muted:#B9CBFF;
  --empty:#0A1850;
  --t1:#2F6BFF; --t2:#FFB21A; --t3:#16C47A; --t4:#B04BF5; --t5:#16CFE0;
  --banner-h:0px;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;
  background-color:var(--bg-deep);
  background-image:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%23fff' stroke-opacity='.075' stroke-width='1.6'><circle cx='0' cy='0' r='14'/><circle cx='72' cy='0' r='14'/><circle cx='0' cy='72' r='14'/><circle cx='72' cy='72' r='14'/><path d='M36 12 C42 26 46 30 60 36 C46 42 42 46 36 60 C30 46 26 42 12 36 C26 30 30 26 36 12Z'/><circle cx='36' cy='36' r='5'/><path d='M0 .5H72M.5 0V72'/></g><g fill='%23fff' fill-opacity='.07'><circle cx='0' cy='0' r='5'/><circle cx='72' cy='0' r='5'/><circle cx='0' cy='72' r='5'/><circle cx='72' cy='72' r='5'/></g></svg>"),
    radial-gradient(120% 70% at 50% 0%,#3A78FF 0%,var(--bg) 45%,var(--bg-deep) 100%);
  background-size:72px 72px,100% 100%;background-attachment:fixed;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(var(--banner-h) + max(10px,env(safe-area-inset-bottom,0px))) max(14px,env(safe-area-inset-left,0px));
  box-sizing:border-box}
.wrap{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;justify-content:center}

/* ---------- cabeçalho: placa esmaltada + placar ---------- */
header{display:flex;flex-direction:column;align-items:center;gap:10px}
.placa{width:min(250px,70vw);margin:0;display:block;filter:drop-shadow(0 4px 0 rgba(4,12,52,.55)) drop-shadow(0 8px 14px rgba(2,8,40,.35))}
.placa svg{display:block;width:100%;height:auto}
.hud{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.recorde{justify-self:start;display:flex;align-items:center;gap:6px;background:rgba(6,20,82,.6);border-radius:999px;padding:5px 12px 5px 8px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 3px 0 rgba(4,12,52,.5)}
.recorde svg{width:18px;height:18px;flex-shrink:0}
.recorde .num{font-size:1rem;color:var(--gold)}
.pontos{text-align:center}
.pontos .num{font-size:2.3rem;line-height:1;text-shadow:0 3px 0 rgba(4,12,52,.6)}
.hud #som{justify-self:end}
.lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
.num{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;text-shadow:0 2px 0 rgba(4,12,52,.5)}
.num.sobe{animation:sobe .35s ease-out}
@keyframes sobe{40%{transform:scale(1.18)}}

/* ---------- painel com cercadura ---------- */
.boardwrap{position:relative;align-self:center;width:min(100%,calc(100dvh - var(--banner-h) - 360px));min-width:240px;padding:7px;box-sizing:border-box;border-radius:20px;
  background:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M7 2 12 7 7 12 2 7Z' fill='%231C3FAA' fill-opacity='.85'/><circle cx='7' cy='7' r='1.6' fill='%23FBF8F1'/><g fill='%231C3FAA' fill-opacity='.5'><circle cx='0' cy='0' r='1.6'/><circle cx='14' cy='0' r='1.6'/><circle cx='0' cy='14' r='1.6'/><circle cx='14' cy='14' r='1.6'/></g></svg>") 0 0/14px 14px,
    linear-gradient(180deg,var(--glaze),var(--glaze-2));
  box-shadow:0 0 0 2px var(--cobalt),0 5px 0 rgba(4,12,52,.6),0 16px 32px rgba(2,8,40,.5)}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:7px;background:var(--board);border-radius:13px;touch-action:none;aspect-ratio:1/1;width:100%;box-sizing:border-box;
  box-shadow:0 0 0 2.5px var(--gold),0 0 0 4px var(--cobalt-ink),inset 0 4px 12px rgba(0,0,0,.5)}
.cell{border-radius:5px;position:relative;
  background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23fff' stroke-opacity='.07' stroke-width='3'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/><path d='M50 24 76 50 50 76 24 50Z'/></g></svg>") center/100% 100% no-repeat,var(--empty);
  box-shadow:inset 0 0 0 1px rgba(120,160,255,.12),inset 0 2px 4px rgba(0,0,0,.4)}

/* ---------- azulejos: cada cor tem o seu desenho ---------- */
.tile,.cell.t1,.cell.t2,.cell.t3,.cell.t4,.cell.t5{background:
  var(--m) center/100% 100% no-repeat,
  linear-gradient(180deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 46%,rgba(0,0,0,.2) 100%),
  var(--c);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.42),inset 0 -4px 0 rgba(0,0,0,.26),inset 0 3px 0 rgba(255,255,255,.38),0 2px 4px rgba(0,0,0,.3)}
.t1{--c:var(--t1);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><g fill='%23fff' fill-opacity='.68'><ellipse cx='50' cy='29' rx='9.5' ry='15'/><ellipse cx='50' cy='71' rx='9.5' ry='15'/><ellipse cx='29' cy='50' rx='15' ry='9.5'/><ellipse cx='71' cy='50' rx='15' ry='9.5'/></g><circle cx='50' cy='50' r='10' fill='%23000' fill-opacity='.2'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t2{--c:var(--t2);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><path d='M50 17 83 50 50 83 17 50Z' fill='none' stroke='%23fff' stroke-opacity='.8' stroke-width='6.5' stroke-linejoin='round'/><path d='M50 34 66 50 50 66 34 50Z' fill='%23fff' fill-opacity='.42'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t3{--c:var(--t3);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><circle cx='50' cy='50' r='24' fill='none' stroke='%23fff' stroke-opacity='.8' stroke-width='6.5'/><g fill='%23fff' fill-opacity='.7'><circle cx='50' cy='13' r='4.5'/><circle cx='50' cy='87' r='4.5'/><circle cx='13' cy='50' r='4.5'/><circle cx='87' cy='50' r='4.5'/></g><circle cx='50' cy='50' r='12' fill='%23000' fill-opacity='.18'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t4{--c:var(--t4);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><path d='M50 12 Q55 45 88 50 Q55 55 50 88 Q45 55 12 50 Q45 45 50 12Z' fill='%23fff' fill-opacity='.7'/><circle cx='50' cy='50' r='10' fill='%23000' fill-opacity='.18'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t5{--c:var(--t5);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><g fill='none' stroke='%23fff' stroke-opacity='.8' stroke-width='5.5'><circle cx='50' cy='32' r='13'/><circle cx='50' cy='68' r='13'/><circle cx='32' cy='50' r='13'/><circle cx='68' cy='50' r='13'/></g><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}

.cell.prev{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 2px #FFFFFF,0 0 10px rgba(255,255,255,.45)}
.cell.willclear::after{content:"";position:absolute;inset:0;border-radius:5px;background:#fff;opacity:.45;box-shadow:0 0 12px #fff;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.22}to{opacity:.55}}
.cell.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.cell.burst{animation:burst .42s ease-out forwards;z-index:2}
@keyframes burst{0%{transform:scale(1);opacity:1}35%{transform:scale(1.16);filter:brightness(2) saturate(1.3);box-shadow:0 0 18px #fff}100%{transform:scale(.2) rotate(30deg);opacity:0}}
#fx{position:absolute;inset:-48px;width:calc(100% + 96px);height:calc(100% + 96px);pointer-events:none;z-index:6}

/* ---------- bandeja ---------- */
#tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:112px;touch-action:none}
.slot{display:flex;align-items:center;justify-content:center;min-height:112px;border-radius:16px}
.piece{display:grid;gap:2px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.32))}
.piece .tile{border-radius:4px}
.piece.chega{animation:chega .32s cubic-bezier(.2,1.4,.4,1) both}
.slot:nth-child(2) .piece.chega{animation-delay:.05s}.slot:nth-child(3) .piece.chega{animation-delay:.1s}
@keyframes chega{from{transform:translateY(24px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.slot.dead .piece{opacity:.35;filter:grayscale(.85)}
.slot.dragging .piece{visibility:hidden}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:grid;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
#ghost .tile{border-radius:5px}

/* ---------- elogios ---------- */
.float{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;z-index:7;white-space:nowrap;animation:rise 1.1s ease-out forwards}
.float b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.5rem;line-height:1.05;color:#FFE27A;
  -webkit-text-stroke:5px var(--cobalt-ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--cobalt-ink),0 0 26px rgba(255,201,60,.75)}
.float small{display:block;margin-top:4px;font-family:var(--f-body);font-size:1rem;font-weight:800;letter-spacing:.08em;color:#fff;-webkit-text-stroke:3px var(--cobalt-ink);paint-order:stroke fill}
.float.grande b{font-size:2.9rem}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-25%) scale(.55)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}28%{transform:translate(-50%,-52%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-105%)}}

/* ---------- rodapé ---------- */
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:700;min-height:38px}
#dica{min-width:0}
#comboTag{display:inline-block;margin-left:4px;padding:1px 9px;border-radius:999px;background:var(--gold);color:#5A2A00;font-weight:800;font-variant-numeric:tabular-nums}
#comboTag.zero{background:rgba(255,255,255,.12);color:var(--muted)}
.foot .btns{display:flex;gap:8px;flex-shrink:0}

/* ---------- botões ---------- */
button{font-family:var(--f-body);font-weight:800;font-size:1rem;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#4F82FF,var(--cobalt) 60%);box-shadow:0 4px 0 #0E2470,0 6px 12px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0E2470}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#revive{background:linear-gradient(180deg,#4BEA9E,#16C47A 55%,#0FA463);text-shadow:0 1px 0 rgba(0,60,30,.5);box-shadow:0 4px 0 #0A7A48,0 6px 12px rgba(0,0,0,.25)}
#revive:active{box-shadow:0 1px 0 #0A7A48}
#revive svg{width:1em;height:1em;vertical-align:-.12em;margin-right:6px}
button.mini{background:rgba(6,20,82,.55);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16),0 3px 0 rgba(4,12,52,.5);padding:8px 14px;font-size:.8rem}
button.mini:active{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
#som{padding:6px 10px;line-height:0}
#som svg{width:20px;height:20px}
#som[aria-pressed="false"]{color:var(--muted)}
button:disabled{opacity:.5;filter:grayscale(.6)}

/* ---------- placas (fim de jogo e confirmação) ---------- */
.cartao{position:relative;background:linear-gradient(180deg,var(--glaze),var(--glaze-2));color:var(--cobalt-ink);border-radius:16px;text-align:center;
  box-shadow:inset 0 0 0 3px var(--cobalt),inset 0 0 0 6px var(--glaze),inset 0 0 0 7.5px var(--cobalt),0 5px 0 rgba(4,12,52,.6),0 18px 40px rgba(0,0,0,.45)}
.cartao::before,.cartao::after{content:"";position:absolute;top:12px;width:14px;height:14px;background:var(--cobalt);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 3px var(--glaze)}
.cartao::before{left:12px}.cartao::after{right:12px}
#over{position:absolute;inset:7px;z-index:5;border-radius:13px;background:rgba(8,22,92,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px}
#over .cartao{width:min(290px,100%);padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:entra .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes entra{from{transform:scale(.8);opacity:0}}
#over h2{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0 0 4px;line-height:1.1}
#over .lbl{color:#5B6FA8}
#final{font-size:2.8rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#finalBest{font-size:.85rem;font-weight:700;color:#5B6FA8;min-height:1.2em}
#finalBest.novo{color:#fff;background:linear-gradient(180deg,#FFD95A,#F5A623);padding:3px 12px;border-radius:999px;color:#5A2A00}
#over .acoes{display:flex;flex-direction:column;gap:12px;margin-top:12px;width:100%}
#confirm{position:fixed;inset:0;z-index:60;background:rgba(2,8,40,.6);display:flex;align-items:center;justify-content:center;padding:24px}
#confirm .cartao{padding:26px 20px 20px;max-width:290px;display:flex;flex-direction:column;gap:16px;font-weight:700;font-size:1rem}
#confirm .row{display:flex;gap:10px;justify-content:center}
button.claro{background:transparent;color:var(--cobalt-ink);box-shadow:inset 0 0 0 2px var(--cobalt),0 3px 0 rgba(20,46,128,.35)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.cell.burst,.float,.cell.pop,.piece.chega,#over .cartao,.num.sobe{animation-duration:.01s;animation-delay:0s}.cell.willclear::after{animation:none}}
</style>
<script src="ads-config.js"></script>
<script src="ads.js"></script>
<script src="sons.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="placa" aria-label="Azulejaria">
      <svg viewBox="0 0 220 66" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="vidrado" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E3D4"/></linearGradient>
          <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".42" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <g id="canto"><circle r="6.5" fill="#1C3FAA"/><circle r="2.4" fill="#FFC93C"/></g>
        </defs>
        <rect x="1" y="1" width="218" height="64" rx="9" fill="url(#vidrado)"/>
        <g stroke="#CFC6B2" stroke-width=".9"><path d="M1 33H219"/><path d="M32.3 1V65M63.6 1V65M94.9 1V65M126.2 1V65M157.5 1V65M188.8 1V65"/></g>
        <rect x="5" y="5" width="210" height="56" rx="6" fill="none" stroke="#1C3FAA" stroke-width="3"/>
        <rect x="9.5" y="9.5" width="201" height="47" rx="3" fill="none" stroke="#1C3FAA" stroke-width="1"/>
        <use href="#canto" x="9.5" y="9.5"/><use href="#canto" x="210.5" y="9.5"/><use href="#canto" x="9.5" y="56.5"/><use href="#canto" x="210.5" y="56.5"/>
        <path d="M110 5.5 114 9.5 110 13.5 106 9.5Z" fill="#1C3FAA"/><path d="M110 52.5 114 56.5 110 60.5 106 56.5Z" fill="#1C3FAA"/>
        <rect x="1" y="1" width="218" height="64" rx="9" fill="url(#brilho)" opacity=".7"/>
        <text x="110" y="43" text-anchor="middle" font-family="Young Serif, Georgia, serif" font-size="28" fill="#142E80" letter-spacing=".3">Azulejaria</text>
      </svg>
    </h1>
    <div class="hud">
      <div class="recorde" title="Recorde"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 11H5z" fill="#FFC93C" stroke="#7A3A00" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="lbl" style="position:absolute;left:-9999px">Recorde</span><span class="num" id="best">0</span></div>
      <div class="pontos" aria-label="Pontos"><div class="num" id="score">0</div></div>
      <button class="mini" id="som" type="button" aria-pressed="true" aria-label="Som"></button>
    </div>
  </header>

  <div class="boardwrap">
    <div id="board" aria-label="Painel de 8 por 8"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="over" hidden>
      <div class="cartao">
        <h2>Painel cheio</h2>
        <div class="lbl">Sua obra valeu</div>
        <div id="final">0</div>
        <div id="finalBest"></div>
        <div class="acoes">
          <button id="revive" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5v13l11-6.5z" fill="currentColor"/></svg><span>Ver vídeo e continuar</span></button>
          <button id="again" type="button">Nova partida</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tray"></div>

  <div class="foot">
    <span id="dica"></span>
    <div class="btns">
      <button class="mini" id="restart" type="button">Recomeçar</button>
    </div>
  </div>
</div>

<div id="confirm" hidden>
  <div class="cartao">
    <div>Recomeçar e perder este painel?</div>
    <div class="row"><button class="claro" id="cNo" type="button">Voltar</button><button id="cYes" type="button">Recomeçar</button></div>
  </div>
</div>

<script>
(function(){
const N=8;
const BASES=["#","##","###","####","#####","##/##","###/###/###","##/##/##","#./##","#../#../###","#./#./##",".#/.#/##","###/.#.",".##/##.","##./.##","#./.#","#../.#./..#"];
const PEQUENAS=[0,1,2,8]; // índices em BASES usados no "continuar"
function parse(s){const c=[];s.split("/").forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==="#")c.push([y,x])}));return c}
function norm(c){const my=Math.min(...c.map(p=>p[0])),mx=Math.min(...c.map(p=>p[1]));return c.map(([y,x])=>[y-my,x-mx]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function rot(c){return norm(c.map(([y,x])=>[x,-y]))}
const FAMILIES=BASES.map(b=>{let c=norm(parse(b));const out=[],seen=new Set();for(let i=0;i<4;i++){const k=JSON.stringify(c);if(!seen.has(k)){seen.add(k);out.push(c)}c=rot(c)}return out});
function dims(c){return[Math.max(...c.map(p=>p[0]))+1,Math.max(...c.map(p=>p[1]))+1]}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function randPiece(fams){const f=pick(fams||FAMILIES);return{cells:pick(f),color:1+Math.floor(Math.random()*5)}}

const $=id=>document.getElementById(id);
const boardEl=$("board"),trayEl=$("tray");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const som=()=>window.Sons||null;
let best=+store.get("azulejaria-best")||0;
let S,trayNova=true;

const cellEls=[];
for(let i=0;i<N*N;i++){const d=document.createElement("div");d.className="cell";boardEl.appendChild(d);cellEls.push(d)}

function fits(grid,cells,r,c){for(const[y,x]of cells){const yy=r+y,xx=c+x;if(yy<0||xx<0||yy>=N||xx>=N||grid[yy*N+xx])return false}return true}
function anyFit(grid,p){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(grid,p.cells,r,c))return true;return false}
function fullLines(grid){const rows=[],cols=[];for(let r=0;r<N;r++){let f=true;for(let c=0;c<N;c++)if(!grid[r*N+c]){f=false;break}if(f)rows.push(r)}
  for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++)if(!grid[r*N+c]){f=false;break}if(f)cols.push(c)}return{rows,cols}}

function save(){store.set("azulejaria-estado",JSON.stringify(S))}
function newGame(){S={grid:Array(N*N).fill(0),tray:[randPiece(),randPiece(),randPiece()],score:0,combo:0,since:0,over:false,revived:false,recordeAvisado:false};trayNova=true;save();render()}

function renderBoard(prev){
  const g=S.grid;let clearSet=null,prevSet=null;
  if(prev){prevSet=new Set(prev.cells.map(([y,x])=>(prev.r+y)*N+prev.c+x));
    const tmp=g.slice();prevSet.forEach(i=>tmp[i]=prev.color);const{rows,cols}=fullLines(tmp);
    clearSet=new Set();rows.forEach(r=>{for(let c=0;c<N;c++)clearSet.add(r*N+c)});cols.forEach(c=>{for(let r=0;r<N;r++)clearSet.add(r*N+c)})}
  cellEls.forEach((el,i)=>{if(el.classList.contains("burst"))return;
    let cls="cell";if(g[i])cls+=" t"+g[i];else if(prevSet&&prevSet.has(i))cls+=" prev";
    if(clearSet&&clearSet.has(i))cls+=" willclear";if(el.classList.contains("pop")&&g[i])cls+=" pop";el.className=cls});
}
function pieceEl(p,size,gap){const[h,w]=dims(p.cells);const el=document.createElement("div");el.className="piece";
  el.style.gridTemplateColumns=`repeat(${w},${size}px)`;el.style.gridTemplateRows=`repeat(${h},${size}px)`;el.style.gap=gap+"px";
  p.cells.forEach(([y,x])=>{const t=document.createElement("div");t.className="tile t"+p.color;t.style.gridRow=y+1;t.style.gridColumn=x+1;el.appendChild(t)});return el}
function renderTray(){trayEl.innerHTML="";const slotW=trayEl.clientWidth/3-10;
  S.tray.forEach((p,i)=>{const s=document.createElement("div");s.className="slot";s.dataset.i=i;
    if(p){const sz=Math.min(22,Math.floor((slotW-8)/5));const el=pieceEl(p,sz,2);if(trayNova)el.classList.add("chega");s.appendChild(el);if(!anyFit(S.grid,p))s.classList.add("dead")}
    trayEl.appendChild(s)});trayNova=false}
let ultimoPlacar=-1;
function renderHud(){const sc=$("score");sc.textContent=S.score;$("best").textContent=Math.max(best,S.score);
  if(ultimoPlacar>=0&&S.score>ultimoPlacar){sc.classList.remove("sobe");void sc.offsetWidth;sc.classList.add("sobe")}ultimoPlacar=S.score;
  const vazio=S.score===0&&S.grid.every(v=>!v);
  $("dica").innerHTML=vazio?"Arraste os azulejos para o painel":'Combo <span id="comboTag" class="'+(S.combo>1?"":"zero")+'">'+(S.combo>1?"×"+S.combo:"—")+"</span>"}
function renderOver(){$("over").hidden=!S.over;if(!S.over)return;$("final").textContent=S.score;
  const fb=$("finalBest"),novo=S.score>=best&&S.score>0;fb.textContent=novo?"Novo recorde!":"Recorde: "+best;fb.classList.toggle("novo",novo);
  const rv=$("revive");rv.hidden=S.revived;rv.disabled=!window.Anuncios||!Anuncios.premiadoDisponivel();
  rv.querySelector("span").textContent=rv.disabled?"Vídeo indisponível agora":"Ver vídeo e continuar"}
function render(){renderBoard();renderTray();renderHud();renderOver()}

function floatText(main,sub,grande){const f=document.createElement("div");f.className="float"+(grande?" grande":"");
  f.innerHTML="<b>"+main+"</b>"+(sub?"<small>"+sub+"</small>":"");
  document.querySelector(".boardwrap").appendChild(f);setTimeout(()=>f.remove(),1100)}
function bumpBest(){if(S.score>best){best=S.score;store.set("azulejaria-best",best)}}

/* estilhaços de azulejo ao limpar linhas */
const fx=$("fx"),fxc=fx.getContext("2d");let parts=[],fxOn=false,dpr=1;
const reduz=window.matchMedia?matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
function corDe(n){return getComputedStyle(document.documentElement).getPropertyValue("--t"+n).trim()||"#fff"}
function estilhacos(lista){if(reduz.matches)return;
  const fr=fx.getBoundingClientRect(),br=boardEl.getBoundingClientRect(),g=geom();dpr=Math.min(2,window.devicePixelRatio||1);
  const W=Math.round(fr.width*dpr),H=Math.round(fr.height*dpr);if(fx.width!==W||fx.height!==H){fx.width=W;fx.height=H}
  const cores={};
  lista.forEach(([k,c])=>{const x=br.left-fr.left+g.pad+(k%N)*g.step+g.cell/2,y=br.top-fr.top+g.pad+Math.floor(k/N)*g.step+g.cell/2;
    const col=cores[c]||(cores[c]=corDe(c));
    for(let j=0;j<4;j++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*3.5;
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:g.cell*(.16+Math.random()*.2),r:Math.random()*6,vr:(Math.random()-.5)*.4,col,t:0})}});
  if(!fxOn){fxOn=true;requestAnimationFrame(passo)}}
function passo(){fxc.setTransform(dpr,0,0,dpr,0,0);fxc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.t<1);
  for(const p of parts){p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.t+=1/42;
    fxc.save();fxc.globalAlpha=Math.max(0,1-p.t);fxc.translate(p.x,p.y);fxc.rotate(p.r);
    fxc.fillStyle=p.col;fxc.fillRect(-p.s/2,-p.s/2,p.s,p.s);fxc.fillStyle="rgba(255,255,255,.6)";fxc.fillRect(-p.s/2,-p.s/2,p.s,p.s*.3);fxc.restore()}
  if(parts.length)requestAnimationFrame(passo);else{fxOn=false;fxc.clearRect(0,0,fx.width,fx.height)}}

const ELOGIOS={2:"Primoroso!",3:"Magnífico!",4:"Obra-prima!"};
function place(i,r,c){const p=S.tray[i];const postos=p.cells.map(([y,x])=>(r+y)*N+c+x);postos.forEach(k=>S.grid[k]=p.color);S.tray[i]=null;
  let gain=p.cells.length;const{rows,cols}=fullLines(S.grid);const lines=rows.length+cols.length;
  if(lines){S.combo++;S.since=0;const burst=new Set();rows.forEach(rr=>{for(let x=0;x<N;x++)burst.add(rr*N+x)});cols.forEach(cc=>{for(let y=0;y<N;y++)burst.add(y*N+cc)});
    gain+=lines*10*(lines>1?lines:1)*Math.max(1,S.combo);
    const cacos=[];burst.forEach(k=>{cacos.push([k,S.grid[k]]);cellEls[k].className="cell t"+S.grid[k]+" burst";S.grid[k]=0});
    estilhacos(cacos);
    setTimeout(()=>{burst.forEach(k=>cellEls[k].classList.remove("burst"));renderBoard()},420);
    const limpo=S.grid.every(v=>!v);if(limpo)gain+=300;
    const s=som();if(s){s.encaixar(p.cells.length);s.limpar(lines,S.combo);if(limpo)s.painelLimpo()}
    if(navigator.vibrate)try{navigator.vibrate(lines>1?[20,40,30]:15)}catch(e){}
    const combo=S.combo>1?" · Combo ×"+S.combo:"";
    if(limpo)floatText("Painel limpo!","+"+gain+combo,true);
    else if(lines>1)floatText(ELOGIOS[Math.min(lines,4)],"+"+gain+combo,lines>=3);
    else if(S.combo>1)floatText("Combo ×"+S.combo,"+"+gain);
    else floatText("+"+gain,"")}
  else{S.since++;if(S.since>=3)S.combo=0;const s=som();if(s)s.encaixar(p.cells.length)}
  const antes=S.score;S.score+=gain;
  if(best>0&&antes<=best&&S.score>best&&!S.recordeAvisado){S.recordeAvisado=true;setTimeout(()=>{floatText("Novo recorde!","",true);const s=som();if(s)s.recorde()},lines?900:150)}
  bumpBest();
  if(S.tray.every(t=>!t)){S.tray=[randPiece(),randPiece(),randPiece()];trayNova=true}
  if(!S.tray.some(t=>t&&anyFit(S.grid,t)))S.over=true;
  save();renderBoard();
  postos.forEach(k=>{if(S.grid[k]){const el=cellEls[k];el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),240)}});
  renderTray();renderHud();
  if(S.over)setTimeout(()=>{renderOver();const s=som();if(s){if(S.score>=best&&S.score>0)s.recorde();else s.fimDeJogo()}},600)}

/* Continuar: 3 peças pequenas que cabem no tabuleiro, uma vez por partida */
function revive(){const fams=PEQUENAS.map(k=>FAMILIES[k]);const out=[];
  for(let n=0;n<3;n++){let p,t=0;do{p=randPiece(fams);t++}while(!anyFit(S.grid,p)&&t<40);out.push(p)}
  S.tray=out;S.over=false;S.revived=true;trayNova=true;save();render()}
$("revive").onclick=async()=>{const b=$("revive");b.disabled=true;b.querySelector("span").textContent="Carregando vídeo…";
  const ok=await Anuncios.mostrarPremiado();if(ok)revive();else renderOver()};

/* arrastar */
let drag=null,ghost=null;
function geom(){const b=boardEl.getBoundingClientRect();const pad=7,gap=3;const cell=(b.width-pad*2-gap*(N-1))/N;return{b,pad,gap,cell,step:cell+gap}}
trayEl.addEventListener("pointerdown",e=>{const s=e.target.closest(".slot");if(!s||S.over)return;const i=+s.dataset.i,p=S.tray[i];if(!p)return;
  e.preventDefault();const g=geom();ghost=pieceEl(p,g.cell,g.gap);ghost.id="ghost";document.body.appendChild(ghost);
  const[h,w]=dims(p.cells);const lift=e.pointerType==="mouse"?g.cell*.6:g.cell*1.8;
  drag={i,p,g,w,h,lift,slot:s,pos:null};const so=som();if(so)so.pegar();s.classList.add("dragging");move(e)});
function move(e){if(!drag)return;const{g,w,h,lift}=drag;const pw=w*g.step-g.gap,ph=h*g.step-g.gap;
  const left=e.clientX-pw/2,top=e.clientY-ph-lift+g.cell*.5;ghost.style.transform=`translate(${left}px,${top}px)`;
  const c=Math.round((left-g.b.left-g.pad)/g.step),r=Math.round((top-g.b.top-g.pad)/g.step);
  if(fits(S.grid,drag.p.cells,r,c)){drag.pos={r,c};renderBoard({cells:drag.p.cells,r,c,color:drag.p.color})}else{drag.pos=null;renderBoard()}}
window.addEventListener("pointermove",move,{passive:true});
function end(){if(!drag)return;const d=drag;drag=null;ghost.remove();ghost=null;d.slot.classList.remove("dragging");
  if(d.pos)place(d.i,d.pos.r,d.pos.c);else{renderBoard();const s=som();if(s)s.invalido()}}
window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);

async function novaComAnuncio(){if(window.Anuncios)await Anuncios.talvezIntersticial();newGame()}
$("again").onclick=novaComAnuncio;
$("restart").onclick=()=>{if(S.over||S.score===0){novaComAnuncio();return}$("confirm").hidden=false};
$("cNo").onclick=()=>$("confirm").hidden=true;
$("cYes").onclick=()=>{$("confirm").hidden=true;novaComAnuncio()};

/* botão de som */
const ICONE_SOM='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICONE_MUDO='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function renderSom(){const b=$("som"),on=!window.Sons||Sons.ligado;b.setAttribute("aria-pressed",on);b.setAttribute("aria-label",on?"Desligar som":"Ligar som");b.innerHTML=on?ICONE_SOM:ICONE_MUDO}
$("som").onclick=()=>{if(window.Sons)Sons.alternar();renderSom()};renderSom();
window.addEventListener("resize",()=>renderTray());

/* retoma a partida salva ao reabrir o app */
try{const s=JSON.parse(store.get("azulejaria-estado"));if(s&&Array.isArray(s.grid)&&s.grid.length===N*N&&Array.isArray(s.tray)){S=s;render()}else newGame()}catch(e){newGame()}
window.__azulejaria={get S(){return S},fits,anyFit,fullLines,place,revive,FAMILIES};
})();
</script>
</body>
</html>
