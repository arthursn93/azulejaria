<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A1F6B">
<title>Azulejaria: Block Puzzle!</title>
<style>
@font-face{font-family:"Young Serif";src:url(fonts/young-serif-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
/* Identidade: um painel de azulejos de Lisboa. Fundo em azul-cobalto com padrão de azulejo,
   placa de rua esmaltada como logotipo, moldura creme (cercadura) em volta do painel,
   e cada cor de azulejo com o seu próprio desenho (ajuda também quem tem daltonismo). */
:root{
  color-scheme:dark;
  --bg:#1546C9; --bg-deep:#0A1F6B; --board:#0B1B5C;
  --glaze:#FBF8F1; --glaze-2:#ECE6D8; --cobalt:#1C3FAA; --cobalt-ink:#142E80;
  --gold:#FFC93C; --gold-deep:#E8930C;
  --ink:#FFFFFF; --muted:#B9CBFF;
  --empty:#0A1850;
  --t1:#2F6BFF; --t2:#FFB21A; --t3:#16C47A; --t4:#B04BF5; --t5:#16CFE0;
  --banner-h:0px;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;
  background-color:var(--bg-deep);
  background-image:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%23fff' stroke-opacity='.075' stroke-width='1.6'><circle cx='0' cy='0' r='14'/><circle cx='72' cy='0' r='14'/><circle cx='0' cy='72' r='14'/><circle cx='72' cy='72' r='14'/><path d='M36 12 C42 26 46 30 60 36 C46 42 42 46 36 60 C30 46 26 42 12 36 C26 30 30 26 36 12Z'/><circle cx='36' cy='36' r='5'/><path d='M0 .5H72M.5 0V72'/></g><g fill='%23fff' fill-opacity='.07'><circle cx='0' cy='0' r='5'/><circle cx='72' cy='0' r='5'/><circle cx='0' cy='72' r='5'/><circle cx='72' cy='72' r='5'/></g></svg>"),
    radial-gradient(120% 70% at 50% 0%,#3A78FF 0%,var(--bg) 45%,var(--bg-deep) 100%);
  background-size:72px 72px,100% 100%;background-attachment:fixed;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(var(--banner-h) + max(10px,env(safe-area-inset-bottom,0px))) max(14px,env(safe-area-inset-left,0px));
  box-sizing:border-box}
.wrap{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;justify-content:center}

/* ---------- cabeçalho: placa esmaltada + placar ---------- */
header{display:flex;flex-direction:column;align-items:center;gap:10px}
.placa{width:min(250px,70vw);margin:0;display:block;filter:drop-shadow(0 4px 0 rgba(4,12,52,.55)) drop-shadow(0 8px 14px rgba(2,8,40,.35))}
.placa svg{display:block;width:100%;height:auto}
.hud{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.recorde{justify-self:start;display:flex;align-items:center;gap:6px;background:rgba(6,20,82,.6);border-radius:999px;padding:5px 12px 5px 8px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 3px 0 rgba(4,12,52,.5)}
.recorde svg{width:18px;height:18px;flex-shrink:0}
.recorde .num{font-size:1rem;color:var(--gold)}
.pontos{text-align:center}
.pontos .num{font-size:2.3rem;line-height:1;text-shadow:0 3px 0 rgba(4,12,52,.6)}
.hud #som{justify-self:end}
.lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
.num{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;text-shadow:0 2px 0 rgba(4,12,52,.5)}
.num.sobe{animation:sobe .35s ease-out}
@keyframes sobe{40%{transform:scale(1.18)}}

/* ---------- painel com cercadura ---------- */
.boardwrap{position:relative;align-self:center;width:min(100%,calc(100dvh - var(--banner-h) - 360px));min-width:240px;padding:7px;box-sizing:border-box;border-radius:20px;
  background:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M7 2 12 7 7 12 2 7Z' fill='%231C3FAA' fill-opacity='.85'/><circle cx='7' cy='7' r='1.6' fill='%23FBF8F1'/><g fill='%231C3FAA' fill-opacity='.5'><circle cx='0' cy='0' r='1.6'/><circle cx='14' cy='0' r='1.6'/><circle cx='0' cy='14' r='1.6'/><circle cx='14' cy='14' r='1.6'/></g></svg>") 0 0/14px 14px,
    linear-gradient(180deg,var(--glaze),var(--glaze-2));
  box-shadow:0 0 0 2px var(--cobalt),0 5px 0 rgba(4,12,52,.6),0 16px 32px rgba(2,8,40,.5)}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:7px;background:var(--board);border-radius:13px;touch-action:none;aspect-ratio:1/1;width:100%;box-sizing:border-box;
  box-shadow:0 0 0 2.5px var(--gold),0 0 0 4px var(--cobalt-ink),inset 0 4px 12px rgba(0,0,0,.5)}
.cell{border-radius:5px;position:relative;
  background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23fff' stroke-opacity='.07' stroke-width='3'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/><path d='M50 24 76 50 50 76 24 50Z'/></g></svg>") center/100% 100% no-repeat,var(--empty);
  box-shadow:inset 0 0 0 1px rgba(120,160,255,.12),inset 0 2px 4px rgba(0,0,0,.4)}

/* ---------- azulejos: cada cor tem o seu desenho ---------- */
.tile,.cell.t1,.cell.t2,.cell.t3,.cell.t4,.cell.t5{background:
  var(--m) center/100% 100% no-repeat,
  linear-gradient(180deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 46%,rgba(0,0,0,.2) 100%),
  var(--c);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.42),inset 0 -4px 0 rgba(0,0,0,.26),inset 0 3px 0 rgba(255,255,255,.38),0 2px 4px rgba(0,0,0,.3)}
.t1{--c:var(--t1);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><g fill='%23fff' fill-opacity='.68'><ellipse cx='50' cy='29' rx='9.5' ry='15'/><ellipse cx='50' cy='71' rx='9.5' ry='15'/><ellipse cx='29' cy='50' rx='15' ry='9.5'/><ellipse cx='71' cy='50' rx='15' ry='9.5'/></g><circle cx='50' cy='50' r='10' fill='%23000' fill-opacity='.2'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t2{--c:var(--t2);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><path d='M50 17 83 50 50 83 17 50Z' fill='none' stroke='%23fff' stroke-opacity='.8' stroke-width='6.5' stroke-linejoin='round'/><path d='M50 34 66 50 50 66 34 50Z' fill='%23fff' fill-opacity='.42'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t3{--c:var(--t3);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><circle cx='50' cy='50' r='24' fill='none' stroke='%23fff' stroke-opacity='.8' stroke-width='6.5'/><g fill='%23fff' fill-opacity='.7'><circle cx='50' cy='13' r='4.5'/><circle cx='50' cy='87' r='4.5'/><circle cx='13' cy='50' r='4.5'/><circle cx='87' cy='50' r='4.5'/></g><circle cx='50' cy='50' r='12' fill='%23000' fill-opacity='.18'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t4{--c:var(--t4);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><path d='M50 12 Q55 45 88 50 Q55 55 50 88 Q45 55 12 50 Q45 45 50 12Z' fill='%23fff' fill-opacity='.7'/><circle cx='50' cy='50' r='10' fill='%23000' fill-opacity='.18'/><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}
.t5{--c:var(--t5);--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23fff' fill-opacity='.36'><circle cx='0' cy='0' r='17'/><circle cx='100' cy='0' r='17'/><circle cx='0' cy='100' r='17'/><circle cx='100' cy='100' r='17'/></g><g fill='none' stroke='%23fff' stroke-opacity='.8' stroke-width='5.5'><circle cx='50' cy='32' r='13'/><circle cx='50' cy='68' r='13'/><circle cx='32' cy='50' r='13'/><circle cx='68' cy='50' r='13'/></g><circle cx='50' cy='50' r='6.5' fill='%23fff'/></svg>")}

.cell.prev{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 2px #FFFFFF,0 0 10px rgba(255,255,255,.45)}
.cell.willclear::after{content:"";position:absolute;inset:0;border-radius:5px;background:#fff;opacity:.45;box-shadow:0 0 12px #fff;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.22}to{opacity:.55}}
.cell.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.cell.burst{animation:burst .42s ease-out forwards;z-index:2}
@keyframes burst{0%{transform:scale(1);opacity:1}35%{transform:scale(1.16);filter:brightness(2) saturate(1.3);box-shadow:0 0 18px #fff}100%{transform:scale(.2) rotate(30deg);opacity:0}}
#fx{position:absolute;inset:-48px;width:calc(100% + 96px);height:calc(100% + 96px);pointer-events:none;z-index:6}

/* ---------- bandeja ---------- */
#tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:112px;touch-action:none}
.slot{display:flex;align-items:center;justify-content:center;min-height:112px;border-radius:16px}
.piece{display:grid;gap:2px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.32))}
.piece .tile{border-radius:4px}
.piece.chega{animation:chega .32s cubic-bezier(.2,1.4,.4,1) both}
.slot:nth-child(2) .piece.chega{animation-delay:.05s}.slot:nth-child(3) .piece.chega{animation-delay:.1s}
@keyframes chega{from{transform:translateY(24px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.slot.dead .piece{opacity:.35;filter:grayscale(.85)}
.slot.dragging .piece{visibility:hidden}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:grid;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
#ghost .tile{border-radius:5px}

/* ---------- elogios ---------- */
.float{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;z-index:7;white-space:nowrap;animation:rise 1.1s ease-out forwards}
.float b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.5rem;line-height:1.05;color:#FFE27A;
  -webkit-text-stroke:5px var(--cobalt-ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--cobalt-ink),0 0 26px rgba(255,201,60,.75)}
.float small{display:block;margin-top:4px;font-family:var(--f-body);font-size:1rem;font-weight:800;letter-spacing:.08em;color:#fff;-webkit-text-stroke:3px var(--cobalt-ink);paint-order:stroke fill}
.float.grande b{font-size:2.9rem}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-25%) scale(.55)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}28%{transform:translate(-50%,-52%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-105%)}}

/* ---------- rodapé ---------- */
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:700;min-height:38px}
#dica{min-width:0}
#comboTag{display:inline-block;margin-left:4px;padding:1px 9px;border-radius:999px;background:var(--gold);color:#5A2A00;font-weight:800;font-variant-numeric:tabular-nums}
#comboTag.zero{background:rgba(255,255,255,.12);color:var(--muted)}
.foot .btns{display:flex;gap:8px;flex-shrink:0}

/* ---------- botões ---------- */
button{font-family:var(--f-body);font-weight:800;font-size:1rem;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#4F82FF,var(--cobalt) 60%);box-shadow:0 4px 0 #0E2470,0 6px 12px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0E2470}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#revive{background:linear-gradient(180deg,#4BEA9E,#16C47A 55%,#0FA463);text-shadow:0 1px 0 rgba(0,60,30,.5);box-shadow:0 4px 0 #0A7A48,0 6px 12px rgba(0,0,0,.25)}
#revive:active{box-shadow:0 1px 0 #0A7A48}
#revive svg{width:1em;height:1em;vertical-align:-.12em;margin-right:6px}
button.mini{background:rgba(6,20,82,.55);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16),0 3px 0 rgba(4,12,52,.5);padding:8px 14px;font-size:.8rem}
button.mini:active{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
#som{padding:6px 10px;line-height:0}
#som svg{width:20px;height:20px}
#som[aria-pressed="false"]{color:var(--muted)}
button:disabled{opacity:.5;filter:grayscale(.6)}

/* ---------- placas (fim de jogo e confirmação) ---------- */
.cartao{position:relative;background:linear-gradient(180deg,var(--glaze),var(--glaze-2));color:var(--cobalt-ink);border-radius:16px;text-align:center;
  box-shadow:inset 0 0 0 3px var(--cobalt),inset 0 0 0 6px var(--glaze),inset 0 0 0 7.5px var(--cobalt),0 5px 0 rgba(4,12,52,.6),0 18px 40px rgba(0,0,0,.45)}
.cartao::before,.cartao::after{content:"";position:absolute;top:12px;width:14px;height:14px;background:var(--cobalt);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 3px var(--glaze)}
.cartao::before{left:12px}.cartao::after{right:12px}
#over{position:absolute;inset:7px;z-index:5;border-radius:13px;background:rgba(8,22,92,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px}
#over .cartao{width:min(290px,100%);padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:entra .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes entra{from{transform:scale(.8);opacity:0}}
#over h2{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0 0 4px;line-height:1.1}
#over .lbl{color:#5B6FA8}
#final{font-size:2.8rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#finalBest{font-size:.85rem;font-weight:700;color:#5B6FA8;min-height:1.2em}
#finalBest.novo{color:#fff;background:linear-gradient(180deg,#FFD95A,#F5A623);padding:3px 12px;border-radius:999px;color:#5A2A00}
#over .acoes{display:flex;flex-direction:column;gap:12px;margin-top:12px;width:100%}
#over .extras{display:flex;gap:18px;justify-content:center;margin-top:10px}
button.link{background:none;box-shadow:none;padding:4px 2px;color:var(--cobalt-ink);font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
#confirm{position:fixed;inset:0;z-index:60;background:rgba(2,8,40,.6);display:flex;align-items:center;justify-content:center;padding:24px}
#confirm .cartao{padding:26px 20px 20px;max-width:290px;display:flex;flex-direction:column;gap:16px;font-weight:700;font-size:1rem}
#confirm .row{display:flex;gap:10px;justify-content:center}
button.claro{background:transparent;color:var(--cobalt-ink);box-shadow:inset 0 0 0 2px var(--cobalt),0 3px 0 rgba(20,46,128,.35)}
#tuto{position:fixed;inset:0;z-index:55;background:rgba(2,8,40,.6);display:flex;align-items:center;justify-content:center;padding:24px}
#tuto .cartao{padding:30px 22px 20px;max-width:300px;display:flex;flex-direction:column;gap:14px}
#tuto h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0}
#tuto p{margin:0;font-size:1rem;line-height:1.35}
#tutoPassos{font-size:.8rem;font-weight:700;color:#5B6FA8}
#tuto .row{display:flex;gap:10px;justify-content:center}
/* menu inicial e ranking */
#menu{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 24px calc(24px + var(--banner-h));background:inherit;background-color:var(--bg-deep)}
#menu .placa{width:min(290px,78vw)}
#menu .sub{font-family:var(--f-display);font-size:1.6rem;color:var(--gold);text-shadow:0 3px 0 rgba(4,12,52,.6);margin-top:-6px}
#menu .melhor{color:var(--muted);font-weight:700;min-height:1.2em}
#menu .acoes{display:flex;flex-direction:column;gap:12px;width:min(260px,80vw);margin-top:10px}
#menu .acoes button{font-size:1.1rem;padding:14px}
#menu button.claro{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 3px 0 rgba(4,12,52,.45)}
#somMenu{padding:6px 10px;line-height:0}#somMenu svg{width:20px;height:20px}
#menu .rodape{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px}
#ranking{position:fixed;inset:0;z-index:58;background:rgba(2,8,40,.6);display:flex;align-items:center;justify-content:center;padding:24px}
#ranking .cartao{padding:28px 20px 18px;width:min(300px,100%);display:flex;flex-direction:column;gap:12px}
#ranking h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0}
#rankLista{list-style:none;margin:0;padding:0;text-align:left;font-variant-numeric:tabular-nums}
#rankLista li{display:flex;gap:10px;align-items:baseline;padding:6px 4px;border-bottom:1px solid #DCD3BF}
#rankLista li b{width:1.6em;color:#5B6FA8}#rankLista li span{flex:1;font-weight:800;font-size:1.05rem}#rankLista li small{color:#5B6FA8}
#rankLista li.atual{background:#FFE9A8;border-radius:6px}
#rankVazio{color:#5B6FA8;font-weight:600}
/* abertura SixPAC Games (mascote Dobra): ~1,9 s, toque para pular. Mascote pula, nome sobe, piscadela no fim */
#abertura{position:fixed;inset:0;z-index:90;background:#2B0B3D;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#abertura svg{width:min(60vw,250px);height:auto;overflow:visible}
#abertura .masc{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:abMasc .5s cubic-bezier(.3,1.5,.5,1) .15s forwards}
#abertura .nome{opacity:0;animation:abNome .35s ease-out .5s forwards}
#abertura .pisca{transform-box:fill-box;transform-origin:50% 60%;animation:abPisca .26s ease-in-out 1.2s}
#abertura.sai{opacity:0}
@keyframes abMasc{0%{opacity:0;transform:translateY(14%) scale(.86,.72)}60%{opacity:1;transform:translateY(-3%) scale(1.04,1.07)}100%{opacity:1;transform:none}}
@keyframes abNome{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes abPisca{0%,100%{transform:none}45%,60%{transform:scaleY(.12)}}
@media (prefers-reduced-motion: reduce){#abertura .masc,#abertura .nome{animation:none;opacity:1;transform:none}#abertura .pisca{animation:none}}
/* temas de azulejo (liberados pelo recorde) */
html.tema-noite{--t1:#5B6CFF;--t2:#E8B04A;--t3:#2FB59A;--t4:#D04A9C;--t5:#6FC6F0}
html.tema-sevilha{--t1:#E2572B;--t2:#F5C518;--t3:#2E9E5B;--t4:#2B5FD9;--t5:#F08A24}
html.tema-porto{--t1:#7AA2FF;--t2:#FFD36E;--t3:#72DDAE;--t4:#CDA2FF;--t5:#86E8F2}
/* fúria de combo e perigo */
.boardwrap.furia{box-shadow:0 0 0 2px var(--gold),0 0 24px 6px rgba(255,201,60,.75),0 5px 0 rgba(4,12,52,.6)}
.boardwrap.furia #board{animation:furia .9s ease-in-out infinite alternate}
@keyframes furia{to{box-shadow:0 0 0 2.5px #fff,0 0 0 4px var(--gold),inset 0 0 26px rgba(255,201,60,.55)}}
.boardwrap.perigo{animation:perigo 1.1s ease-in-out infinite}
@keyframes perigo{50%{box-shadow:0 0 0 2px #FF4D4D,0 0 22px 4px rgba(255,60,60,.6),0 5px 0 rgba(4,12,52,.6)}}
#trocar{font-size:.8rem}
/* menu: linha de botões pequenos */
#menu #mAtualizar{background:rgba(6,20,82,.55);color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold),0 3px 0 rgba(4,12,52,.45);font-size:.9rem;padding:10px}
#menu #mAtualizar:disabled{opacity:.75;filter:none}
#menu .linha{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#menu .linha button{font-size:.78rem;padding:11px 4px}
#mDesafio{background:linear-gradient(180deg,#FFD95A,#F5A623);color:#5A2A00;text-shadow:none;box-shadow:0 4px 0 #A65F00,0 6px 12px rgba(0,0,0,.25)}
#mDesafio small{display:block;font-size:.72rem;font-weight:700;opacity:.85;margin-top:2px}
/* cartões genéricos (estatísticas, ajustes, lembrete) */
.painelc{position:fixed;inset:0;z-index:58;background:rgba(2,8,40,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.painelc .cartao{padding:28px 20px 18px;width:min(310px,100%);display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto}
.painelc h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0}
.dados{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;font-variant-numeric:tabular-nums}
.dados span{color:#5B6FA8;font-weight:600}.dados b{font-size:1.05rem}
.opcao{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-weight:700}
.chave{width:48px;height:28px;border-radius:999px;padding:0;background:#C9C2B2;box-shadow:none;position:relative;flex-shrink:0}
.chave::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.chave[aria-checked="true"]{background:#16C47A}.chave[aria-checked="true"]::after{left:23px}
.opcao select{font:inherit;padding:6px;border-radius:8px;border:2px solid var(--cobalt);color:var(--cobalt-ink);background:#fff}
.temas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.temas button{padding:8px 6px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff;color:var(--cobalt-ink);box-shadow:inset 0 0 0 2px #D8D0BE;text-shadow:none}
.temas button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--cobalt)}
.temas button:disabled{opacity:.55}
.temas i{display:flex;gap:2px}.temas i b{width:12px;height:12px;border-radius:3px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.cell.burst,.float,.cell.pop,.piece.chega,#over .cartao,.num.sobe{animation-duration:.01s;animation-delay:0s}.cell.willclear::after{animation:none}}
</style>

    <div class="row"><button class="claro" id="tutoPular" type="button" data-t="tutoPular">Pular</button><button id="tutoProx" type="button"></button></div>
  </div>
</div>

<script>
aplicarIdioma();
(function(){
const N=8;
const BASES=["#","##","###","####","#####","##/##","###/###/###","##/##/##","#./##","#../#../###","#./#./##",".#/.#/##","###/.#.",".##/##.","##./.##","#./.#","#../.#./..#"];
const PEQUENAS=[0,1,2,8]; // índices em BASES usados no "continuar"
function parse(s){const c=[];s.split("/").forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==="#")c.push([y,x])}));return c}
function norm(c){const my=Math.min(...c.map(p=>p[0])),mx=Math.min(...c.map(p=>p[1]));return c.map(([y,x])=>[y-my,x-mx]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function rot(c){return norm(c.map(([y,x])=>[x,-y]))}
const FAMILIES=BASES.map(b=>{let c=norm(parse(b));const out=[],seen=new Set();for(let i=0;i<4;i++){const k=JSON.stringify(c);if(!seen.has(k)){seen.add(k);out.push(c)}c=rot(c)}return out});
function dims(c){return[Math.max(...c.map(p=>p[0]))+1,Math.max(...c.map(p=>p[1]))+1]}
/* no desafio diário as peças vêm de um gerador com semente: o mesmo dia dá as mesmas peças para todos */
function rnd(){if(S&&S.modo==="diario"){let t=(S.rng=(S.rng+0x6D2B79F5)>>>0);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}return Math.random()}
function pick(a){return a[Math.floor(rnd()*a.length)]}
/* cores liberadas aos poucos: começa só com o cobalto e ganha uma cor nova a cada marco de pontos */
const MARCOS_COR=[0,100,300,600,1000];
function coresAte(p){return MARCOS_COR.filter(m=>p>=m).length}
function randPiece(fams){const f=pick(fams||FAMILIES);const n=S?coresAte(S.score):1;return{cells:pick(f),color:1+Math.floor(rnd()*n)}}

const $=id=>document.getElementById(id);
const boardEl=$("board"),trayEl=$("tray");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const som=()=>window.Sons||null;
let best=+store.get("azulejaria-best")||0;
let S,trayNova=true;

const cellEls=[];
for(let i=0;i<N*N;i++){const d=document.createElement("div");d.className="cell";boardEl.appendChild(d);cellEls.push(d)}

function fits(grid,cells,r,c){for(const[y,x]of cells){const yy=r+y,xx=c+x;if(yy<0||xx<0||yy>=N||xx>=N||grid[yy*N+xx])return false}return true}
function anyFit(grid,p){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(grid,p.cells,r,c))return true;return false}
function fullLines(grid){const rows=[],cols=[];for(let r=0;r<N;r++){let f=true;for(let c=0;c<N;c++)if(!grid[r*N+c]){f=false;break}if(f)rows.push(r)}
  for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++)if(!grid[r*N+c]){f=false;break}if(f)cols.push(c)}return{rows,cols}}

function chaveEstado(m){return m==="diario"?"azulejaria-estado-diario":"azulejaria-estado"}
function save(){store.set(chaveEstado(S.modo),JSON.stringify(S))}
function hoje(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hashTxt(t){let h=2166136261;for(const ch of t){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function carregar(m){try{const s=JSON.parse(store.get(chaveEstado(m)));if(s&&Array.isArray(s.grid)&&s.grid.length===N*N&&Array.isArray(s.tray)&&(m!=="diario"||s.dia===hoje()))return s}catch(e){}return null}
function newGame(modo){modo=modo||(S&&S.modo)||"classico";S=null;
  const base={id:Date.now(),modo,grid:Array(N*N).fill(0),tray:[],score:0,combo:0,since:0,over:false,revived:false,recordeAvisado:false};
  if(modo==="diario"){const dia=hoje(),seed=hashTxt("azulejaria-"+dia);Object.assign(base,{dia,rng:seed,meta:300+(seed%5)*50,metaOk:false});S=base}
  else S=base;
  S.tray=[randPiece(),randPiece(),randPiece()];trayNova=true;save();render();
  if(window.Metricas)Metricas.evento("partida_inicio",{modo})}

function renderBoard(prev){
  const g=S.grid;let clearSet=null,prevSet=null;
  if(prev){prevSet=new Set(prev.cells.map(([y,x])=>(prev.r+y)*N+prev.c+x));
    const tmp=g.slice();prevSet.forEach(i=>tmp[i]=prev.color);const{rows,cols}=fullLines(tmp);
    clearSet=new Set();rows.forEach(r=>{for(let c=0;c<N;c++)clearSet.add(r*N+c)});cols.forEach(c=>{for(let r=0;r<N;r++)clearSet.add(r*N+c)})}
  cellEls.forEach((el,i)=>{if(el.classList.contains("burst"))return;
    let cls="cell";if(g[i])cls+=" t"+g[i];else if(prevSet&&prevSet.has(i))cls+=" prev";
    if(clearSet&&clearSet.has(i))cls+=" willclear";if(el.classList.contains("pop")&&g[i])cls+=" pop";el.className=cls});
}
function pieceEl(p,size,gap){const[h,w]=dims(p.cells);const el=document.createElement("div");el.className="piece";
  el.style.gridTemplateColumns=`repeat(${w},${size}px)`;el.style.gridTemplateRows=`repeat(${h},${size}px)`;el.style.gap=gap+"px";
  p.cells.forEach(([y,x])=>{const t=document.createElement("div");t.className="tile t"+p.color;t.style.gridRow=y+1;t.style.gridColumn=x+1;el.appendChild(t)});return el}
function renderTray(){trayEl.innerHTML="";const slotW=trayEl.clientWidth/3-10;
  S.tray.forEach((p,i)=>{const s=document.createElement("div");s.className="slot";s.dataset.i=i;
    if(p){const sz=Math.min(22,Math.floor((slotW-8)/5));const el=pieceEl(p,sz,2);if(trayNova)el.classList.add("chega");s.appendChild(el);if(!anyFit(S.grid,p))s.classList.add("dead")}
    trayEl.appendChild(s)});trayNova=false}
let ultimoPlacar=-1;
function renderHud(){const sc=$("score");sc.textContent=S.score;
  $("best").textContent=S.modo==="diario"?(S.metaOk?"✓ ":"🎯 ")+S.meta:Math.max(best,S.score);
  document.querySelector(".recorde svg").style.display=S.modo==="diario"?"none":"";
  document.querySelector(".recorde").title=S.modo==="diario"?T("meta"):T("recorde");
  const bw=document.querySelector(".boardwrap");bw.classList.toggle("furia",S.combo>=5&&!S.over);
  const livres=S.grid.filter(v=>!v).length;bw.classList.toggle("perigo",!S.over&&livres<=14);
  atualizaTrocar();
  if(ultimoPlacar>=0&&S.score>ultimoPlacar){sc.classList.remove("sobe");void sc.offsetWidth;sc.classList.add("sobe")}ultimoPlacar=S.score;
  const vazio=S.score===0&&S.grid.every(v=>!v);
  $("dica").innerHTML=vazio?T("dica"):T("combo")+' <span id="comboTag" class="'+(S.combo>1?"":"zero")+'">'+(S.combo>1?"×"+S.combo:"—")+"</span>"}
function renderOver(){$("over").hidden=!S.over;if(!S.over)return;$("final").textContent=S.score;
  const fb=$("finalBest"),novo=S.modo!=="diario"&&S.score>=best&&S.score>0;
  fb.textContent=S.modo==="diario"?(S.metaOk?T("desafioOk"):T("meta")+": "+S.meta):novo?T("novoRecorde"):T("recorde")+": "+best;fb.classList.toggle("novo",novo||!!S.metaOk);
  $("again").textContent=S.modo==="diario"?T("tentarDeNovo"):T("novaPartida");
  atualizaRevive()}
/* "Continuar": espera o vídeo carregar; sem internet, libera uma segunda chance grátis */
let overDesde=0,reviveTimer=0;
function videoPronto(){return!!(window.Anuncios&&Anuncios.premiadoDisponivel())}
function atualizaRevive(){const rv=$("revive");rv.hidden=S.revived;if(S.revived||!S.over){clearInterval(reviveTimer);reviveTimer=0;return}
  if(!overDesde)overDesde=Date.now();
  const gratis=!videoPronto()&&Date.now()-overDesde>6000;rv.dataset.gratis=gratis?"1":"";
  rv.disabled=!videoPronto()&&!gratis;
  rv.querySelector("span").textContent=videoPronto()?T("verVideo"):gratis?T("continuarGratis"):T("carregando");
  if(!reviveTimer)reviveTimer=setInterval(()=>{if($("over").hidden||rv.dataset.ocupado)return;atualizaRevive()},1000)}
function render(){renderBoard();renderTray();renderHud();renderOver()}

function floatText(main,sub,grande){const f=document.createElement("div");f.className="float"+(grande?" grande":"");
  f.innerHTML="<b>"+main+"</b>"+(sub?"<small>"+sub+"</small>":"");
  document.querySelector(".boardwrap").appendChild(f);setTimeout(()=>f.remove(),1100)}
function bumpBest(){if(S.modo==="diario")return;if(S.score>best){best=S.score;store.set("azulejaria-best",best)}}

/* estilhaços de azulejo ao limpar linhas */
const fx=$("fx"),fxc=fx.getContext("2d");let parts=[],fxOn=false,dpr=1;
const reduz=window.matchMedia?matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
function corDe(n){return getComputedStyle(document.documentElement).getPropertyValue("--t"+n).trim()||"#fff"}
function estilhacos(lista){if(reduz.matches)return;
  const fr=fx.getBoundingClientRect(),br=boardEl.getBoundingClientRect(),g=geom();dpr=Math.min(2,window.devicePixelRatio||1);
  const W=Math.round(fr.width*dpr),H=Math.round(fr.height*dpr);if(fx.width!==W||fx.height!==H){fx.width=W;fx.height=H}
  const cores={};
  lista.forEach(([k,c])=>{const x=br.left-fr.left+g.pad+(k%N)*g.step+g.cell/2,y=br.top-fr.top+g.pad+Math.floor(k/N)*g.step+g.cell/2;
    const col=cores[c]||(cores[c]=corDe(c));
    for(let j=0;j<4;j++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*3.5;
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:g.cell*(.16+Math.random()*.2),r:Math.random()*6,vr:(Math.random()-.5)*.4,col,t:0})}});
  if(!fxOn){fxOn=true;requestAnimationFrame(passo)}}
function passo(){fxc.setTransform(dpr,0,0,dpr,0,0);fxc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.t<1);
  for(const p of parts){p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.t+=1/42;
    fxc.save();fxc.globalAlpha=Math.max(0,1-p.t);fxc.translate(p.x,p.y);fxc.rotate(p.r);
    fxc.fillStyle=p.col;fxc.fillRect(-p.s/2,-p.s/2,p.s,p.s);fxc.fillStyle="rgba(255,255,255,.6)";fxc.fillRect(-p.s/2,-p.s/2,p.s,p.s*.3);fxc.restore()}
  if(parts.length)requestAnimationFrame(passo);else{fxOn=false;fxc.clearRect(0,0,fx.width,fx.height)}}

const ELOGIOS={2:T("elogio2"),3:T("elogio3"),4:T("elogio4")};
function place(i,r,c){const p=S.tray[i];const postos=p.cells.map(([y,x])=>(r+y)*N+c+x);postos.forEach(k=>S.grid[k]=p.color);S.tray[i]=null;
  let gain=p.cells.length;const{rows,cols}=fullLines(S.grid);const lines=rows.length+cols.length;
  if(lines){S.combo++;S.since=0;const burst=new Set();rows.forEach(rr=>{for(let x=0;x<N;x++)burst.add(rr*N+x)});cols.forEach(cc=>{for(let y=0;y<N;y++)burst.add(y*N+cc)});
    gain+=lines*10*(lines>1?lines:1)*Math.max(1,S.combo);
    if(S.combo>=5)gain*=2;
    est.linhas+=lines;est.combo=Math.max(est.combo,S.combo);
    const cacos=[];burst.forEach(k=>{cacos.push([k,S.grid[k]]);cellEls[k].className="cell t"+S.grid[k]+" burst";S.grid[k]=0});
    estilhacos(cacos);
    setTimeout(()=>{burst.forEach(k=>cellEls[k].classList.remove("burst"));renderBoard()},420);
    const limpo=S.grid.every(v=>!v);if(limpo){gain+=300;est.limpos++}
    const s=som();if(s){s.encaixar(p.cells.length);s.limpar(lines,S.combo);if(limpo)s.painelLimpo()}
    vibrar(lines>1?[20,40,30]:15);
    const combo=S.combo>1?" · "+T("combo")+" ×"+S.combo:"";
    if(limpo)floatText(T("painelLimpo"),"+"+gain+combo,true);
    else if(lines>1)floatText(ELOGIOS[Math.min(lines,4)],"+"+gain+combo,lines>=3);
    else if(S.combo===5){floatText(T("furia"),"+"+gain,true);const so=som();if(so)so.furia()}
    else if(S.combo>1)floatText(T("combo")+" ×"+S.combo,"+"+gain);
    else floatText("+"+gain,"")}
  else{S.since++;if(S.since>=3)S.combo=0;const s=som();if(s)s.encaixar(p.cells.length)}
  const antes=S.score;S.score+=gain;
  if(coresAte(S.score)>coresAte(antes))setTimeout(()=>floatText(T("novaCor"),"",false),lines?1250:200);
  if(S.modo!=="diario"&&best>0&&antes<=best&&S.score>best&&!S.recordeAvisado){S.recordeAvisado=true;setTimeout(()=>{floatText(T("novoRecorde"),"",true);const s=som();if(s)s.recorde()},lines?900:150)}
  if(S.modo==="diario"&&!S.metaOk&&S.score>=S.meta){S.metaOk=true;const n=marcarSequencia();
    setTimeout(()=>{floatText(T("desafioOk"),T("diasSeguidos").replace("{n}",n),true);const so=som();if(so)so.recorde()},lines?900:150);
    if(window.Metricas)Metricas.evento("desafio_concluido",{sequencia:n})}
  const bestAntes=best;bumpBest();
  if(TEMAS.some(t=>t.min>bestAntes&&t.min<=best))setTimeout(()=>floatText(T("temaNovo"),"",false),1600);
  salvaEst();
  if(S.tray.every(t=>!t)){S.tray=[randPiece(),randPiece(),randPiece()];trayNova=true}
  if(!S.tray.some(t=>t&&anyFit(S.grid,t)))S.over=true;
  save();renderBoard();
  postos.forEach(k=>{if(S.grid[k]){const el=cellEls[k];el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),240)}});
  renderTray();renderHud();
  const livres=S.grid.filter(v=>!v).length;
  if(!S.over&&livres<=14&&!S.perigoAvisado){S.perigoAvisado=true;const so=som();if(so)so.perigo();vibrar([30,60,30])}
  if(livres>20)S.perigoAvisado=false;
  if(S.over){registrarRank();fimDePartida();setTimeout(()=>{renderOver();const s=som();if(s){if(S.modo!=="diario"&&S.score>=best&&S.score>0)s.recorde();else s.fimDeJogo()}},600)}}

/* Continuar: 3 peças pequenas que cabem no tabuleiro, uma vez por partida */
function revive(){overDesde=0;const fams=PEQUENAS.map(k=>FAMILIES[k]);const out=[];
  for(let n=0;n<3;n++){let p,t=0;do{p=randPiece(fams);t++}while(!anyFit(S.grid,p)&&t<40);out.push(p)}
  S.tray=out;S.over=false;S.revived=true;trayNova=true;save();render()}
$("revive").onclick=async()=>{const b=$("revive");if(window.Metricas)Metricas.evento("continuar",{tipo:b.dataset.gratis?"gratis":"video"});if(b.dataset.gratis){revive();return}
  b.disabled=true;b.dataset.ocupado="1";b.querySelector("span").textContent=T("carregando");
  const ok=await Anuncios.mostrarPremiado();b.dataset.ocupado="";if(ok)revive();else renderOver()};

/* arrastar */
let drag=null,ghost=null;
function geom(){const b=boardEl.getBoundingClientRect();const pad=7,gap=3;const cell=(b.width-pad*2-gap*(N-1))/N;return{b,pad,gap,cell,step:cell+gap}}
trayEl.addEventListener("pointerdown",e=>{const s=e.target.closest(".slot");if(!s||S.over)return;const i=+s.dataset.i,p=S.tray[i];if(!p)return;
  e.preventDefault();const g=geom();ghost=pieceEl(p,g.cell,g.gap);ghost.id="ghost";document.body.appendChild(ghost);
  const[h,w]=dims(p.cells);const lift=e.pointerType==="mouse"?g.cell*.6:g.cell*1.8;
  drag={i,p,g,w,h,lift,slot:s,pos:null};const so=som();if(so)so.pegar();s.classList.add("dragging");move(e)});
function move(e){if(!drag)return;const{g,w,h,lift}=drag;const pw=w*g.step-g.gap,ph=h*g.step-g.gap;
  const left=e.clientX-pw/2,top=e.clientY-ph-lift+g.cell*.5;ghost.style.transform=`translate(${left}px,${top}px)`;
  const c=Math.round((left-g.b.left-g.pad)/g.step),r=Math.round((top-g.b.top-g.pad)/g.step);
  if(fits(S.grid,drag.p.cells,r,c)){drag.pos={r,c};renderBoard({cells:drag.p.cells,r,c,color:drag.p.color})}else{drag.pos=null;renderBoard()}}
window.addEventListener("pointermove",move,{passive:true});
function end(){if(!drag)return;const d=drag;drag=null;ghost.remove();ghost=null;d.slot.classList.remove("dragging");
  if(d.pos)place(d.i,d.pos.r,d.pos.c);else{renderBoard();const s=som();if(s)s.invalido()}}
window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);

async function novaComAnuncio(){if(window.Anuncios)await Anuncios.talvezIntersticial();overDesde=0;newGame()}
$("again").onclick=novaComAnuncio;
$("restart").onclick=()=>{if(S.over||S.score===0){novaComAnuncio();return}$("confirm").hidden=false};
$("cNo").onclick=()=>$("confirm").hidden=true;
$("cYes").onclick=()=>{$("confirm").hidden=true;novaComAnuncio()};

/* botão de som */
const ICONE_SOM='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICONE_MUDO='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function renderSom(){const b=$("som"),on=!window.Sons||Sons.ligado;b.setAttribute("aria-pressed",on);b.setAttribute("aria-label",on?T("desligarSom"):T("ligarSom"));b.innerHTML=on?ICONE_SOM:ICONE_MUDO}
$("som").onclick=()=>{if(window.Sons)Sons.alternar();renderSom()};renderSom();
window.addEventListener("resize",()=>renderTray());

/* avaliar e compartilhar (só no fim de jogo) */
const LOJA="https://play.google.com/store/apps/details?id=io.github.arthursn93.azulejaria";
$("avaliar").onclick=()=>window.open(LOJA,"_blank");
/* imagem do resultado: o painel, a pontuação e o nome do jogo, num cartão 1080x1350 */
function imagemResultado(){const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const fundo=g.createLinearGradient(0,0,0,H);fundo.addColorStop(0,"#2D63F0");fundo.addColorStop(1,"#0A1F6B");g.fillStyle=fundo;g.fillRect(0,0,W,H);
  const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r)};
  g.textAlign="center";g.fillStyle="#FBF8F1";rr(240,70,600,140,22);g.fill();g.strokeStyle="#1C3FAA";g.lineWidth=8;rr(254,84,572,112,14);g.stroke();
  g.fillStyle="#142E80";g.font='72px "Young Serif",Georgia,serif';g.fillText("Azulejaria",540,165);
  g.fillStyle="#FFC93C";g.font='52px "Young Serif",Georgia,serif';g.fillText("Block Puzzle!",540,280);
  const cs=getComputedStyle(document.documentElement),cor=n=>cs.getPropertyValue("--t"+n).trim();
  const lado=720,x0=(W-lado)/2,y0=330,pad=22,gap=8,cel=(lado-pad*2-gap*7)/8;
  g.fillStyle="#FBF8F1";rr(x0-14,y0-14,lado+28,lado+28,34);g.fill();g.fillStyle="#0B1B5C";rr(x0,y0,lado,lado,26);g.fill();
  S.grid.forEach((v,i)=>{const x=x0+pad+(i%8)*(cel+gap),y=y0+pad+Math.floor(i/8)*(cel+gap);g.fillStyle=v?cor(v):"#0A1850";rr(x,y,cel,cel,12);g.fill();
    if(v){g.fillStyle="rgba(255,255,255,.35)";rr(x,y,cel,cel*.35,12);g.fill();g.fillStyle="#fff";g.beginPath();g.arc(x+cel/2,y+cel/2,cel*.1,0,7);g.fill()}});
  g.fillStyle="#fff";g.font='800 120px Figtree,sans-serif';g.fillText(S.score,540,1200);
  g.fillStyle="#B9CBFF";g.font='700 40px Figtree,sans-serif';g.fillText(T("baixe"),540,1280);return c}
async function compartilharImagem(txt){const c=imagemResultado();const P=window.Capacitor&&Capacitor.Plugins||{};
  const dados=c.toDataURL("image/png");
  if(P.Share&&P.Filesystem){const r=await P.Filesystem.writeFile({path:"azulejaria-resultado.png",data:dados.split(",")[1],directory:"CACHE"});
    await P.Share.share({text:txt+" "+LOJA,files:[r.uri]});return true}
  if(navigator.canShare){const blob=await (await fetch(dados)).blob();const f=new File([blob],"azulejaria.png",{type:"image/png"});
    if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:txt+" "+LOJA});return true}}
  return false}
$("compartilhar").onclick=async()=>{const txt=T("convite").replace("{p}",S.score);if(window.Metricas)Metricas.evento("compartilhar",{pontos:S.score});
  try{if(await compartilharImagem(txt))return}catch(e){}
  try{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;
    if(P)await P.share({text:txt,url:LOJA});else if(navigator.share)await navigator.share({text:txt,url:LOJA});
    else window.open(LOJA,"_blank")}catch(e){}};

/* ranking local: as 10 melhores partidas, guardadas no aparelho */
function lerRank(){try{const r=JSON.parse(store.get("azulejaria-ranking"));return Array.isArray(r)?r:[]}catch(e){return[]}}
function registrarRank(){if(!S.score||S.modo==="diario")return;let r=lerRank().filter(x=>x.id!==S.id);r.push({id:S.id||Date.now(),p:S.score,d:Date.now()});
  r.sort((a,b)=>b.p-a.p);store.set("azulejaria-ranking",JSON.stringify(r.slice(0,10)))}
function abrirRank(){const r=lerRank(),ul=$("rankLista");ul.innerHTML="";
  r.forEach((x,i)=>{const li=document.createElement("li");if(S&&x.id===S.id)li.className="atual";
    const b=document.createElement("b");b.textContent=(i+1)+".";const sp=document.createElement("span");sp.textContent=x.p;
    const sm=document.createElement("small");sm.textContent=new Date(x.d).toLocaleDateString(IDIOMA);li.append(b,sp,sm);ul.appendChild(li)});
  $("rankVazio").hidden=r.length>0;$("ranking").hidden=false}
$("verRank").onclick=abrirRank;$("mRank").onclick=abrirRank;$("rankFechar").onclick=()=>$("ranking").hidden=true;

/* menu inicial */
$("menuPlaca").appendChild(document.querySelector("header .placa svg").cloneNode(true));
function emAndamento(){const c=S&&S.modo!=="diario"?S:carregar("classico");return!!(c&&!c.over&&c.score>0)}
function abrirMenu(){$("menuBest").textContent=best?T("recorde")+": "+best:"";
  $("mJogar").textContent=emAndamento()?T("continuar"):T("jogar");$("mNova").hidden=!emAndamento();
  const feito=(lerSeq().ultimo===hoje()),n=seqAtual();
  $("mDesafioInfo").textContent=feito?T("desafioFeito")+(n>1?" · 🔥 "+n:""):n?"🔥 "+T("diasSeguidos").replace("{n}",n):"";
  renderSomMenu();$("menu").hidden=false}
function fecharMenu(){$("menu").hidden=true;save();renderTray();if(!store.get("azulejaria-tutorial")&&S.score===0){renderTuto();$("tuto").hidden=false}}
function entrar(modo){overDesde=0;const s=carregar(modo);if(s&&!s.over){S=s;trayNova=true;render()}else newGame(modo);fecharMenu()}
$("mJogar").onclick=()=>entrar("classico");
$("mNova").onclick=()=>{overDesde=0;newGame("classico");fecharMenu()};
$("mDesafio").onclick=()=>{const s=carregar("diario");if(s&&s.over&&s.revived){S=s;render();fecharMenu();return}entrar("diario")};
$("abrirMenu").onclick=abrirMenu;
/* aviso de atualização da Play Store (só aparece no menu, nunca durante a jogada) */
function renderAtualizar(e){const b=$("mAtualizar");if(!b)return;
  const txt={disponivel:"atualDisp",loja:"atualDisp",baixando:"atualBaixando",pronta:"atualPronta"}[e];
  b.hidden=!txt;b.disabled=e==="baixando";if(txt)b.textContent=T(txt)}
$("mAtualizar").onclick=()=>{if(S)save();if(window.Atualizacao)Atualizacao.agir()};
if(window.Atualizacao)Atualizacao.iniciar(renderAtualizar);
function renderSomMenu(){const on=!window.Sons||Sons.ligado;$("somMenu").innerHTML=on?ICONE_SOM:ICONE_MUDO;$("somMenu").setAttribute("aria-label",on?T("desligarSom"):T("ligarSom"))}
$("somMenu").onclick=()=>{if(window.Sons)Sons.alternar();renderSom();renderSomMenu()};

/* vibração (pode ser desligada nos ajustes) */
function vibraLigado(){return store.get("azulejaria-vibrar")!=="0"}
function vibrar(p){if(vibraLigado()&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* sequência de dias do desafio diário */
function lerSeq(){try{return JSON.parse(store.get("azulejaria-sequencia"))||{n:0,ultimo:"",max:0}}catch(e){return{n:0,ultimo:"",max:0}}}
function ontem(){const d=new Date();d.setDate(d.getDate()-1);return hoje(d)}
function seqAtual(){const q=lerSeq();return q.ultimo===hoje()||q.ultimo===ontem()?q.n:0}
function marcarSequencia(){const q=lerSeq();if(q.ultimo!==hoje()){q.n=q.ultimo===ontem()?q.n+1:1;q.ultimo=hoje();q.max=Math.max(q.max||0,q.n);store.set("azulejaria-sequencia",JSON.stringify(q))}return q.n}

/* estatísticas */
let est=(()=>{try{return Object.assign({jogos:0,pontos:0,combo:0,linhas:0,limpos:0},JSON.parse(store.get("azulejaria-stats"))||{})}catch(e){return{jogos:0,pontos:0,combo:0,linhas:0,limpos:0}}})();
function salvaEst(){store.set("azulejaria-stats",JSON.stringify(est))}
function fimDePartida(){if(!S.contado){est.jogos++;S.contado=true}est.pontos+=S.score-(S.pontosContados||0);S.pontosContados=S.score;salvaEst();
  if(window.Metricas)Metricas.evento("partida_fim",{modo:S.modo||"classico",pontos:S.score});
  if(est.jogos===2&&!store.get("azulejaria-lembrete-perguntado")&&temNotif())setTimeout(()=>{$("pedeLembrete").hidden=false},1400)}
function abrirStats(){const media=est.jogos?Math.round(est.pontos/est.jogos):0;
  const linhas=[["stJogos",est.jogos],["stMedia",media],["stMelhor",best],["stCombo",est.combo?"×"+est.combo:"—"],["stLinhas",est.linhas],["stLimpos",est.limpos],["stSeq",lerSeq().max||0]];
  const d=$("statsDados");d.innerHTML="";linhas.forEach(([k,v])=>{const a=document.createElement("span");a.textContent=T(k);const b=document.createElement("b");b.textContent=v;d.append(a,b)});
  $("stats").hidden=false}
$("mStats").onclick=abrirStats;
document.querySelectorAll(".fechaPainel").forEach(b=>b.onclick=()=>b.closest(".painelc").hidden=true);

/* temas de azulejo: liberados pelo recorde do modo clássico */
const TEMAS=[{id:"lisboa",min:0,nome:"temaLisboa"},{id:"noite",min:1500,nome:"temaNoite"},{id:"sevilha",min:4000,nome:"temaSevilha"},{id:"porto",min:8000,nome:"temaPorto"}];
function aplicaTema(id){TEMAS.forEach(t=>document.documentElement.classList.toggle("tema-"+t.id,t.id===id&&id!=="lisboa"))}
function temaAtual(){const id=store.get("azulejaria-tema")||"lisboa";const t=TEMAS.find(x=>x.id===id);return t&&best>=t.min?id:"lisboa"}
aplicaTema(temaAtual());
function renderTemas(){const box=$("ajTemas");box.innerHTML="";const atual=temaAtual();
  TEMAS.forEach(t=>{const b=document.createElement("button");b.type="button";b.disabled=best<t.min;b.setAttribute("aria-pressed",t.id===atual);
    aplicaTema(t.id);const cs=getComputedStyle(document.documentElement);const i=document.createElement("i");
    for(let k=1;k<=5;k++){const q=document.createElement("b");q.style.background=cs.getPropertyValue("--t"+k);i.appendChild(q)}
    const n=document.createElement("span");n.textContent=b.disabled?"🔒 "+T("bloqueado").replace("{n}",t.min):T(t.nome);b.append(i,n);
    b.onclick=()=>{store.set("azulejaria-tema",t.id);if(window.Metricas)Metricas.evento("tema_escolhido",{tema:t.id});renderTemas()};box.appendChild(b)});
  aplicaTema(atual)}

/* lembrete diário (notificação local, funciona sem internet) */
function notif(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications}
function temNotif(){return!!notif()||!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}
function lembreteLigado(){return store.get("azulejaria-lembrete")==="1"}
async function agendaLembrete(ligar){const L=notif();
  try{if(L){await L.cancel({notifications:[{id:1}]}).catch(()=>{});
    if(ligar){const p=await L.requestPermissions();if(p.display!=="granted")ligar=false;
      else await L.schedule({notifications:[{id:1,title:"Azulejaria: Block Puzzle!",body:T("lembreteTxt"),schedule:{on:{hour:19,minute:0},allowWhileIdle:true}}]})}}}
  catch(e){ligar=false}
  store.set("azulejaria-lembrete",ligar?"1":"0");if(window.Metricas)Metricas.evento("lembrete",{ligado:ligar?1:0});renderAjustes()}
$("lemSim").onclick=()=>{store.set("azulejaria-lembrete-perguntado","1");$("pedeLembrete").hidden=true;agendaLembrete(true)};
$("lemNao").onclick=()=>{store.set("azulejaria-lembrete-perguntado","1");$("pedeLembrete").hidden=true};
if(lembreteLigado())agendaLembrete(true);

/* ajustes */
function renderAjustes(){$("ajSom").setAttribute("aria-checked",!window.Sons||Sons.ligado);$("ajVibrar").setAttribute("aria-checked",vibraLigado());
  $("ajLembrete").setAttribute("aria-checked",lembreteLigado());$("ajLembrete").closest(".opcao").hidden=!temNotif();
  $("ajIdioma").value=store.get("azulejaria-idioma")||"";renderTemas()}
$("mAjustes").onclick=()=>{renderAjustes();$("ajustes").hidden=false};
$("ajSom").onclick=()=>{if(window.Sons)Sons.alternar();renderSom();renderSomMenu();renderAjustes()};
$("ajVibrar").onclick=()=>{store.set("azulejaria-vibrar",vibraLigado()?"0":"1");vibrar(20);renderAjustes()};
$("ajLembrete").onclick=()=>agendaLembrete(!lembreteLigado());
$("ajIdioma").onchange=e=>{const v=e.target.value;try{if(v)localStorage.setItem("azulejaria-idioma",v);else localStorage.removeItem("azulejaria-idioma")}catch(err){}location.reload()};

/* trocar as peças com vídeo premiado: 1 vez por partida */
function atualizaTrocar(){const b=$("trocar");b.hidden=!(S&&!S.over&&!S.trocou&&videoPronto())}
$("trocar").onclick=async()=>{const b=$("trocar");b.disabled=true;const ok=await Anuncios.mostrarPremiado();b.disabled=false;
  if(ok){const out=[];for(let n=0;n<3;n++){let p,t=0;do{p=randPiece();t++}while(!anyFit(S.grid,p)&&t<60);out.push(p)}
    S.tray=out;S.trocou=true;trayNova=true;save();if(window.Metricas)Metricas.evento("trocar_pecas",{})}render()};
setInterval(()=>{if(S)atualizaTrocar()},2000);

/* tutorial de 3 passos, só na primeira vez */
let tutoI=0;
function fechaTuto(){$("tuto").hidden=true;store.set("azulejaria-tutorial","1")}
function renderTuto(){$("tutoTit").textContent=T("tutoT"+(tutoI+1));$("tutoTxt").textContent=T("tutoP"+(tutoI+1));
  $("tutoPassos").textContent=(tutoI+1)+" / 3";$("tutoProx").textContent=T(tutoI<2?"tutoProx":"tutoJogar")}
$("tutoProx").onclick=()=>{if(tutoI<2){tutoI++;renderTuto()}else fechaTuto()};
$("tutoPular").onclick=fechaTuto;

/* retoma a partida salva ao reabrir o app */
{const s=carregar("classico");if(s){S=s;render()}else newGame("classico")}
abrirMenu();
/* fecha a abertura depois de ~1,8 s ou no primeiro toque */
(function(){const a=$("abertura");if(!a)return;let ok=false;
  function fim(){if(ok)return;ok=true;a.classList.add("sai");setTimeout(()=>a.remove(),380)}
  a.addEventListener("pointerdown",fim);setTimeout(fim,reduz.matches?900:1850)})();
window.__azulejaria={get S(){return S},imagemResultado,newGame,entrar,lerSeq,get est(){return est},fits,anyFit,fullLines,place,revive,FAMILIES,coresAte,lerRank};
})();
</script>
